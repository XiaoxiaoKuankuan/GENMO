# 自建 BUMI CSV/WAV 对齐当前 robot_retargeter BUMI3 资产的离线质量与发布规则。
#
# 原始 CSV 来自旧 BUMI3 导出器，关节列为“腿、腰、手臂”；当前 fe934 MJCF 的 MuJoCo
# qpos 顺序为“腰、手臂、腿”。发布工具必须按 source_joint_names 精确重排，禁止把列位置
# 当作关节语义。源动作最多允许 0.01 rad 的新旧限位差，发布时会裁到当前 XML 限位，
# 正式 reader 仍按 0.0001 rad 严格检查。PASS 只说明离线数据契约与运动学检查通过，
# 不等同于 SONIC/GMT 动力学跟踪或实物安全通过。
contract_version: genmo.bumi_csv_quality_config.v2
dataset_name: mine_bumi
expected_kinematics_sha256: c08731704dccece11351b6fa877e30bac5ca2a8d363de30af7ca2ea1398f4029

source:
  allowed_fps: [30, 50]
  quaternion_convention: xyzw
  csv_header:
    - root_pos_x
    - root_pos_y
    - root_pos_z
    - root_rot_x
    - root_rot_y
    - root_rot_z
    - root_rot_w
    - leg.pitch.l
    - leg.roll.l
    - leg.yaw.l
    - knee.pitch.l
    - ankle.pitch.l
    - ankle.roll.l
    - leg.pitch.r
    - leg.roll.r
    - leg.yaw.r
    - knee.pitch.r
    - ankle.pitch.r
    - ankle.roll.r
    - waist.yaw
    - arm.pitch.l
    - arm.roll.l
    - arm.yaw.l
    - elbow.pitch.l
    - arm.pitch.r
    - arm.roll.r
    - arm.yaw.r
    - elbow.pitch.r
  source_joint_names:
    - l_leg_pitch_joint
    - l_leg_roll_joint
    - l_leg_yaw_joint
    - l_knee_pitch_joint
    - l_ankle_pitch_joint
    - l_ankle_roll_joint
    - r_leg_pitch_joint
    - r_leg_roll_joint
    - r_leg_yaw_joint
    - r_knee_pitch_joint
    - r_ankle_pitch_joint
    - r_ankle_roll_joint
    - waist_yaw_joint
    - l_arm_pitch_joint
    - l_arm_roll_joint
    - l_arm_yaw_joint
    - l_elbow_pitch_joint
    - r_arm_pitch_joint
    - r_arm_roll_joint
    - r_arm_yaw_joint
    - r_elbow_pitch_joint
  wav_sample_rate: 48000
  wav_channels: 2
  wav_sample_width_bytes: 2

selection:
  excluded_songs:
    - APT啦啦操
  expected_candidates: 100
  expected_accepted: 99

hard_thresholds:
  minimum_frames: 4
  quaternion_norm_error_max: 0.001
  joint_limit_violation_max: 0.01
  root_height_min_absolute: -0.02
  root_height_max_absolute: 2.1

soft_policy:
  exceed_ratio_max: 0.08
  consecutive_exceed_frames: 10
  severe_multiplier: 3.0

dynamics:
  joint_velocity_l2: 30.0
  joint_acceleration_l2: 1200.0
  joint_jerk_l2: 60000.0
  root_linear_velocity: 3.0
  root_angular_velocity: 12.0

floor_style:
  root_low_height: 0.30
  root_low_tilt_degrees: 45.0
  torso_ground_height: 0.30
  upper_body_ground_height: 0.08
  gate_root_height: 0.34
  gate_tilt_degrees: 40.0
  ankles_airborne_height: 0.08
  reject_consecutive_frames: 25
  review_ratio: 0.02
  review_min_frames: 25
  low_root_review_height: 0.22
  low_root_review_consecutive_frames: 25

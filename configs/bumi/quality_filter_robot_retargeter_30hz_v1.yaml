# robot_retargeter BUMI3 30 Hz Mimic-NPZ 自动质量筛选 v1。
#
# 本契约只接受 `/home/weili/robot_retargeter` feature/bumi3 生产链生成的 30 Hz、
# 13 字段 Mimic NPZ，并同时复核同名 retarget metadata、逐条验证报告和全量 release
# report。它不兼容旧 GMR legacy pickle，也不兼容 50 Hz SONIC 七字段 NPZ。
#
# 状态分为 PASS / REVIEW / REJECT；正式训练构建器只消费 PASS。关节限位是硬门禁，
# 动力学普通持续超限进入 REVIEW、三倍严重峰值进入 REJECT。Root 倾角既参与倒地组合
# 判断，也有逐条分布门禁，避免地板霹雳舞或重定向放大的躺倒动作进入站立机器人训练。
# 所有持续帧阈值按 30 Hz 定义。retarget 报告中的软警告保留为诊断，不替代本筛选器
# 对最终 NPZ 的重新计算。

contract_version: genmo.bumi_robot_retargeter_npz_quality_config.v1

source:
  motion_contract_version: robot_retargeter.bumi3_mimic_npz_30hz.v1
  release_report_schema: robot_retargeter.bumi3_full_release.v1
  fps: 30
  quaternion_convention: wxyz
  robot_name: bumi3
  anchor_body_name: waist_yaw_link
  required_npz_keys:

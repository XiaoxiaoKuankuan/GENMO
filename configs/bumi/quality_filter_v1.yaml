# GMR 生产 BUMI3 legacy pickle 预筛选 v1。
#
# 该配置只对应 data/motions 的 GMR 生产输出；legacy 仅指 pickle 格式，不指机器人
# 版本。source MJCF SHA 必须在 CLI 启动时
# 与真实文件核对。动力学普通超限进入 REVIEW，3 倍严重峰值直接 REJECT；正式
# 物化默认只接收 PASS，因此 REVIEW 不会静默进入训练集。
contract_version: genmo.bumi_quality_config.v1

source:
  motion_contract_version: genmo.bumi_legacy_motion.v1
  mjcf_sha256: 482138b437dbdabd6171fa8d44b55db5d7125a228c95b69ce3d1159cafe8537c
  fps: 30
  quaternion_convention: xyzw
  joint_order:
    - l_leg_pitch_joint
    - l_leg_roll_joint
    - l_leg_yaw_joint
    - l_knee_pitch_joint
    - l_ankle_pitch_joint
    - l_ankle_roll_joint
    - r_leg_pitch_joint
    - r_leg_roll_joint
    - r_leg_yaw_joint
    - r_knee_pitch_joint
    - r_ankle_pitch_joint
    - r_ankle_roll_joint
    - waist_yaw_joint
    - l_arm_pitch_joint
    - l_arm_roll_joint
    - l_arm_yaw_joint
    - l_elbow_pitch_joint
    - r_arm_pitch_joint
    - r_arm_roll_joint
    - r_arm_yaw_joint
    - r_elbow_pitch_joint
  joint_lower_limits:
    [-2.09, -0.66, -2.53, 0.0, -0.96, -0.17,
     -2.09, -1.57, -2.53, 0.0, -0.96, -0.17,
     -1.57,
     -3.14, -0.14, -1.57, -2.26,
     -3.14, -1.94, -1.57, -2.26]
  joint_upper_limits:
    [2.09, 1.57, 2.53, 2.24, 0.44, 0.17,
     2.09, 0.66, 2.53, 2.24, 0.44, 0.17,
     1.57,
     1.57, 1.94, 1.57, 0.0,
     1.57, 0.14, 1.57, 0.0]
  body_order:
    - base_link
    - l_leg_pitch_link
    - l_leg_roll_link
    - l_leg_yaw_link
    - l_knee_pitch_link
    - l_ankle_pitch_link
    - l_ankle_roll_link
    - r_leg_pitch_link
    - r_leg_roll_link
    - r_leg_yaw_link
    - r_knee_pitch_link
    - r_ankle_pitch_link
    - r_ankle_roll_link
    - waist_yaw_link
    - torso_link_virtual
    - l_arm_pitch_link
    - l_arm_roll_link
    - l_arm_yaw_link
    - l_elbow_pitch_link
    - l_arm_hand_link_virtual
    - r_arm_pitch_link
    - r_arm_roll_link
    - r_arm_yaw_link
    - r_elbow_pitch_link
    - r_arm_hand_link_virtual

hard_thresholds:
  quaternion_norm_error_max: 0.001
  joint_limit_violation_max: 0.0001
  minimum_joint_limit_margin_warn: 0.01
  # 历史转换器把整段所有 body origin 的全局最低点平移到 Z=0。
  source_ground_abs_error_max: 0.02
  # 仅拦截明显坐标损坏；低 Root 舞蹈由下方组合规则判定。
  root_height_min_absolute: -0.02
  root_height_max_absolute: 2.1

soft_policy:
  exceed_ratio_max: 0.08
  consecutive_exceed_frames: 6
  severe_multiplier: 3.0
  soft_failure_status: REVIEW

dynamics:
  joint_velocity_l2:
    threshold: 30.0
    unit: rad/s
  joint_acceleration_l2:
    threshold: 1200.0
    unit: rad/s^2
  joint_jerk_l2:
    threshold: 60000.0
    unit: rad/s^3
  # OMG 的 12m/s 和 36rad/s 对当前 30FPS 舞蹈过松；这里按全量分布收紧。
  root_linear_velocity:
    threshold: 3.0
    unit: m/s
  root_angular_velocity:
    threshold: 12.0
    unit: rad/s

floor_style:
  # “低 Root + 大倾角”或躯干/非手部上身贴地提供证据，再通过第二层 gate
  # 排除仅因脚部 body origin 接近地面的正常动作。
  root_low_height: 0.30
  root_low_tilt_degrees: 45.0
  torso_ground_height: 0.30
  upper_body_ground_height: 0.08
  gate_root_height: 0.34
  gate_tilt_degrees: 40.0
  ankles_airborne_height: 0.08
  reject_consecutive_frames: 15
  review_ratio: 0.02
  review_min_frames: 15

  # 单独低 Root 只进入人工复核，避免误杀深蹲和跪姿。
  low_root_review_height: 0.22
  low_root_review_consecutive_frames: 15

  # 记录可供未来切片挽救的安全区间；v1 默认仍按整条序列决策。
  safe_interval_halo_frames: 15
  minimum_safe_interval_frames: 120

  body_groups:
    torso: torso_link_virtual
    upper_non_hand:
      - l_arm_pitch_link
      - l_arm_roll_link
      - l_arm_yaw_link
      - l_elbow_pitch_link
      - r_arm_pitch_link
      - r_arm_roll_link
      - r_arm_yaw_link
      - r_elbow_pitch_link
    hands:
      - l_arm_hand_link_virtual
      - r_arm_hand_link_virtual
    ankles:
      - l_ankle_roll_link
      - r_ankle_roll_link

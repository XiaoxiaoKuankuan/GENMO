# 日常只改本文件里的模型、资产、音乐入口、输出目录和GPU。
# 固定的20步确定性DDIM、精度、显示、标定和告警参数在gem/closedloop/sim2sim/config.py。
# GENMO相关相对路径相对本仓库；GMT相关路径相对下面的gmt_repo；也可填写绝对路径。
paths:
  # GMT仓库搬家只改此处，下面的GMT相对路径会一起跟随。
  gmt_repo: ../legged_lab_gmt

  # 更换Stage1基础模型：改checkpoint，并配套检查stats和kinematics。
  # 模式1通过下方的*stage1_checkpoint自动复用，不用重复改权重路径。
  stage1_checkpoint: &stage1_checkpoint inputs/checkpoints/stage1_server2_s595000_20261008/s595000.pt
  stats: inputs/checkpoints/stage1_server2_s595000_20261008/qpos30_train_stats.json
  kinematics: configs/bumi/bumi_kinematics_robot_retargeter_fe934_v1.json
  # Stage2需使用与训练时匹配的基础模型/stats/kinematics/GMT配套文件。

  # GMT文件换位置：改对应路径；更换策略内容需配套核对以下3个文件。
  # 当前后端限定140500，换其他训练轮数需另行适配后端，不是只改文件名。
  gmt_policy: logs/rsl_rl/tracking_bumi4340_mha_sonic_mimic/2026-09-28_20-12-58_umr_soma50_six50_filtered_scratch/exported/model_140500/policy.onnx
  gmt_checkpoint: logs/rsl_rl/tracking_bumi4340_mha_sonic_mimic/2026-09-28_20-12-58_umr_soma50_six50_filtered_scratch/model_140500.pt
  gmt_agent: logs/rsl_rl/tracking_bumi4340_mha_sonic_mimic/2026-09-28_20-12-58_umr_soma50_six50_filtered_scratch/params/agent.yaml
  # 换机器/虚拟环境：改为能加载GMT原始.pt并做ONNX对照的Python解释器。
  gmt_validation_python: /home/weili/miniconda3/envs/env_isaaclab/bin/python

  # 机器人文件换位置时改此组；MJCF用于动力学，URDF/contract用于参考运动学。
  mjcf: source/NoetixRobot/NoetixRobot/assets/robots/bumi3_4340_lowpd/mjcf/bumi3_4340.xml
  urdf: source/NoetixRobot/NoetixRobot/assets/robots/bumi3_4340_lowpd/urdf/bumi3_4340_point.urdf
  isaac_contract: outputs/datasets/volc_gmt_mine99_20260928/records/root_z_restoration_20260928/isaac_contract.json

  # selection/manifest所引用的数据集搬家改dataset_root；外部音频目录不使用它。
  dataset_root: inputs/evals/stage1_fourset_20260928/selected_data
  # 更换运行报告、轨迹、视频及音乐特征缓存的保存位置，改output_root。
  output_root: outputs/sim2sim

# 按键1为Stage1基础模型，按键2为当前测试模型；更换测试模型只替换第二项路径和名称。
# 当前测试：服务器1 P1正式训练的第500轮，2026-10-16正常完成后固定导出。
models:
  - name: Stage1-s595000
    checkpoint: *stage1_checkpoint
  - name: Stage2-P1-iteration500
    checkpoint: outputs/sim2sim/models/actor_iteration500.pt
    # 需要复查旧模型时，替换上面这一行即可；旧模型不同时启用。
    # checkpoint: outputs/sim2sim/models/actor_iteration147.pt
    # checkpoint: outputs/sim2sim/models/actor_iteration246.pt

# 默认音乐入口：可填selection/manifest、音频清单、单首WAV/MP3或音频文件夹。
# 命令行--audio/--audio-dir/--playlist会覆盖此项；换日常播放目录也可只改这里。
playlist: inputs/evals/stage1_fourset_20260928/selection.json

runtime:
  # 换GPU只改设备编号，如cuda:1。
  device: cuda:0

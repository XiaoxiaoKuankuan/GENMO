# 第十步服务器1七天正式八卡训练：八个GPU同步更新同一个Actor和同一个Critic。
# 以stage10_8gpu_server1.yaml为基线，完整保留算法、奖励、全局64条转移、BC和KL保护；
# rank0继续用单个冻结GMT/CPU PhysX环境采集，八卡共同学习，不改变为八个独立实验。
# 七天为run_manifest.created_at起604800秒的绝对截止，恢复不会延长；到期在完整
# 轮次边界受控停止。10000轮是独立计算预算上限，
# 不承诺七天内完成10000轮。学习率候选保持5e-10/1e-9/2e-9，不按卡数乘8。
# 计算预算允许每轮最多三个Actor候选，并为生成、校准、预热和真实物理推进留余量；
# 实际消耗持久计账，恢复不会清零。每个50Hz控制区间仍对应四个200Hz物理子步。
# 正式run位于服务器1的/data1，存储上限2TiB、文件系统至少100GiB空闲；
# 保留initial、最近2份及每100轮checkpoint，
# 已完成轮次的完整执行数据归档保存，旧的非里程碑checkpoint按明确保留策略回收。
# 使用专用八卡入口和新的正式run；同一配置同一run恢复需显式--resume latest，
# 不允许将旧Tracking或不同训练身份checkpoint作为完整恢复来源。
version: genmo.gmt_frozen_isaac.v1
paths:
  genmo_repo: /home/user/liwei/GENMO-bumi-closedloop
  gmt_repo: /home/user/liwei/legged_lab_gmt
  genmo_python: /home/user/liwei/GENMO/.venv/bin/python
  isaac_python: /data0/user/liwei/closedloop_stage8_runtime/env_isaaclab/bin/python
  checkpoint: /data0/user/liwei/GENMO_outputs/bumi_closedloop_stage1_90505_p6to18_z15_b256_s350k_8gpu_v1/checkpoints/s350000.pt
  stats: /data0/user/liwei/datasets/bumi_music_umr70_mine_pass_v1/stats/qpos30_train_stats.json
  kinematics: /home/user/liwei/GENMO-bumi-closedloop/configs/bumi/bumi_kinematics_robot_retargeter_fe934_v1.json
  gmt_policy: /data0/user/liwei/closedloop_stage8_assets/gmt_model135000/model_135000_stage2.onnx
  compat_profile: /home/user/liwei/legged_lab_gmt/configs/sim2sim/model_135000_stage2.json
  isaac_contract: /data0/user/liwei/closedloop_stage8_assets/gmt_model135000/isaac_contract.json
  data_root: /data0/user/liwei/datasets/bumi_music_umr70_mine_pass_90505_v1
runtime:
  genmo_device: cuda:0
  allow_shared_gpu: false
  physics_device: cpu
  headless: true
  num_envs: 1
  torch_threads: 4
  rpc_timeout_s: 120
  worker_start_timeout_s: 600
model:
  history_steps: 50
  ddim_steps: 20
  guidance_scale: 2.5
timing:
  clock_hz: 600
  decision_ticks: 300
  control_ticks: 12
  physics_ticks: 3
  warmup_ticks: 600
  min_prefix_frames: 12
  lookahead_control_steps: 10
  latency_guard_s: 0.04
  calibration_warmup: 4
  calibration_samples: 12
environment:
  terrain: plane
  ground_height_m: 0.0
  initial_foot_clearance_m: 0.001
  domain_randomization: false
  observation_noise: false
  external_perturbations: false
  reset_randomization: false
  actuator_delay_steps: 0
  curriculum: false
termination:
  orientation_mode: separated_yaw
  root_height_error_m: 0.2
  non_yaw_orientation_error_rad: 0.6
  yaw_error_rad: 1.5
  end_effector_relative_height_error_m: 0.15
diagnostics:
  record_original_threshold_crossings: true
  verify_actor_condition_edges: true
  reward_substeps: true
stage10:
  run_control:
    max_walltime_seconds: 604800
  distributed:
    world_size: 8
    backend: nccl
    collection: rank0
  version: genmo.closedloop.stage10.v1
  seed: 42
  training:
    execution_mode: latency
    denoising_steps: 20
    guidance_scale: 2.5
    eta: 0.1
    std_floor: 0.001
    log_probability_reduction: joint_sum
    rollout_upper_steps: 64
    ppo_epochs: 1
    actor_lr: 1.0e-09
    critic_lr: 0.0001
    actor_lr_candidates:
    - 5.0e-10
    - 1.0e-09
    - 2.0e-09
    critic_steps: 80
    critic_batch: 32
    grad_clip_norm: 1.0
    gamma_upper: 0.99
    lambda_upper: 0.95
    gamma_denoising: 0.99
    ppo_clip: 0.01
    kl_stop_joint: 0.02
    bc_weight: 0.1
    bc_batch: 2
    denoising_microbatch: 1
    episode_seconds: 10.0
    latency_budget_s: 0.5
    critic_grad_clip_norm: 1.0
    bc_prefix:
      min_frames: 6
      max_frames: 30
      zero_probability: 0.15
  dataset:
    split: train
    random_start: true
    source_probabilities:
    - 0.2
    - 0.35
    - 0.25
    - 0.2
    require_audio: true
  evaluation:
    split: val
    eval_count: all
    seeds:
    - 42
    - 1729
    selection_seed: 42
    start_mode: beginning
    episode_seconds: 10.0
  limits:
    accepted_iterations: 10000
    optimizer_attempts: 30000
    generations: 1000000
    control_steps: 25000000
    physics_steps: 100000000
  storage:
    min_free_bytes: 107374182400
    max_run_bytes: 2199023255552
    checkpoint_reserve_bytes: 4294967296
    rollout_chunk_size: 16
    checkpoint_keep_last: 2
    checkpoint_keep_every: 100
    archive_completed_iterations: true
  reward:
    version: stage9.execution_reward.v2
    dt: 0.02
    track_weight: 2.5
    music_weight: 2.0
    stable_weight: 1.0
    alive_weight: 0.5
    cmd_penalty_weight: 0.15
    torque_penalty_weight: 0.1
    contact_penalty_weight: 0.2
    joint_limit_penalty_weight: 0.5
    failure_penalty: 5.0
    rejected_plan_penalty: 0.5
    scales:
      root_height_m: 0.05
      non_yaw_rad: 0.12
      slide_m_s: 0.15
    tracking:
      objective: gmt.motion_tracking.v1
      # 误差来自冻结GMT当前任务的原motion-tracking定义，均为平方误差。
      # joint_pos沿用原12腿关节选择；joint_vel当前未启用，保留原函数默认全21关节。
      std:
        anchor_pos: 0.3
        anchor_ori: 0.4
        body_pos: 0.3
        body_ori: 0.4
        joint_pos: 0.25
        # 原GMT未启用velocity，此std是Stage9预留参数，默认不参与奖励。
        joint_vel: 1.4
      # 原启用比例0.5:0.5:1:1:0.5除以3.5，保持R_track在[0,1]。
      weights:
        anchor_pos: 0.14285714285714285
        anchor_ori: 0.14285714285714285
        body_pos: 0.2857142857142857
        body_ori: 0.2857142857142857
        joint_pos: 0.14285714285714285
        joint_vel: 0.0
    stable_mix:
      root_height: 0.5
      non_yaw: 0.5
    music_mix:
      beat: 0.7
      intensity: 0.3
    torque:
      free_ratio: 0.8
      mean_weight: 0.5
      max_weight: 0.5
    activity:
      window_s: 0.5
      inactive_target_rad_s: 0.1
      full_gate_ratio: 0.5
      epsilon: 1.0e-08
      intensity_epsilon: 0.05
      intensity_log_ratio: 2.0
    music:
      beat_window_s: 1.0
      feature_fps: 30
      beat_column: 34
      beat_threshold: 0.5
    contact:
      slide_weight: 0.7
      bad_contact_weight: 0.3
      support_clearance_m: 0.025
    joint_limit:
      hard_range_margin_fraction: 0.05
      numeric_tolerance_rad: 1.0e-06
      actual_weight: 0.5
      reference_weight: 0.5
    consistency:
      joint_vel_rms_rad_s: 0.0001
      root_lin_vel_rms_m_s: 0.0001
      root_ang_vel_rms_rad_s: 0.0001
    diagnostics:
      mechanical_power_weight: 0.0
      impact_weight: 0.0
    require_substeps: true

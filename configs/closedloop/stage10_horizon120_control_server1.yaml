# 当前连续音乐第二阶段正式候选：s595000 Actor、冻结GMT140500、真实Isaac反馈。
# 120帧/4秒计算对照，保持相同实现及预训练max_len120权重，不裁剪为60帧。
# 每GPU一个64环境世界，PPO按4秒真实世界时间到合法决策边界一起停，正常episode跨轮继续。
# 实际有效链数、尾批和optimizer次数由本轮manifest决定；首轮包含真实重置预热，不强凑4096。
# 行为始终20步随机扩散，PPO每epoch无放回K8；平均自由坐标log-ratio仅为代理，保留原joint统计。
# 主数值核stable_tf32x3，采样/最终全20步KL真正无梯度；Actor主参数与Adam FP32。
# 音乐奖励开关关闭且权重0；音乐条件/CFG/Stage1监督保留，tracking保留配对动作activity gate。
# Critic独立冻结Stage1编码器，256维/2层/4头；固定Actor完整episode MC/TD比例经独立验证选择。
# 完整MC预热256epoch按真实状态量推导步骤，验证MSE降30%且EV>=0.2才允许Actor学习。
# 正式Actor阶段主要用当前新采样TD/GAE，真实终止不bootstrap、普通窗口尾bootstrap、不跨Actor拼GAE。
# 每轮BC总512按实际PPO步数整数分配，局部梯度按实际全局分母累计，一次SUM、一次裁剪更新。
# Actor微批64/KL128保持与主候选相同；部署profile为当前120帧核自己的八卡64请求实测。
# 日常完整链驻GPU至优化与最终KL完成，周期/异常才存完整证据；checkpoint一致CPU快照单在途异步。
# 新schema拒旧实验等价恢复；恢复重建新PhysX episode，48小时沿原始期限累计（停机也计入）。
# 未绑定实际Horizon部署测量hash时正式入口明确拒绝；500轮预算不自动启动长期训练。

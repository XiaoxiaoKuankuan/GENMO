# 第二阶段配置（2026-10-16随机状态修订）：沿用已选Actor学习率1e-7，采样修复须新运行。
# Stage1 s595000初始化GENMO；GMT140500冻结，Isaac Lab提供真实50Hz控制/200Hz物理反馈。
# 实际生成60帧；行为20步，独立Stage1副本冻结前16步，只更新末4步；最终仍检查全20步KL。
# 音乐奖励关闭，音乐条件/CFG/Stage1 BC和配对动作activity gate保留；不添加新奖励。
# 独立冻结预训练Critic先用48首训练音乐完整MC预热；采样/初始化身份已变化，重新预热。
# 每卡64环境、4秒世界采集，正常episode跨轮保留；评估与MC使用单个常驻N4世界。
# 所有资产与部署测量均按固定SHA绑定。随机运动起点必须使用新的运行目录，不能恢复旧P1，
# 没有总墙钟时限；信号安全停止、checkpoint、资源/磁盘、参考截止与物理终止保护保留。
# 采样/初态验收见docs/closedloop/stage10_random_state_fix_20261016.rst；历史优化参数证据
# 见docs/closedloop/stage10_formalization_20261014.rst，不将历史模型效果当作本修订的训练结果。

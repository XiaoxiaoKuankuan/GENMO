# 服务器2 Stage1 随机初始化正式训练配置，目标为600000个优化步，而不是600000个数据epoch。
#
# 复用当前Stage1 Actor、示范历史、逐坐标前缀和原有损失：1024维16层8头Transformer，
# H=50，120帧30Hz，qpos30/contact2。仅调整本次用户指定的前缀分布、数据/统计量身份、
# 随机初始化和训练总步数；不引入第二阶段奖励、真实历史适配或新的衔接损失。
# 数据使用当前90/5/5四库；Mine必须是source_csv_root_z_preserved_v1及恢复后的接触标签。
# 统计量仅由当前4287条train序列重新计算，独立存放，不覆盖旧checkpoint依赖的统计量。
# warm_start、stage1_checkpoint和resume均显式关闭；已有零初始化条件残差沿用架构定义，
# 不从任何已训练模型加载参数。优化器、调度器和global_step从头建立。
# 八卡DDP，每卡batch256，全局2048；warmup500和原学习率不变，cosine周期同步到600000。
# 每5000步保留完整断点，共120份约310GB，避免原1000步频率在60万步时耗尽数据盘。

# 十步可训练扩散的独立有限对照：9冻结＋10训练＋1冻结末步，保持20步真实采样。
# Root训练奖励std恢复0.3/0.4，其他物理、奖励、连续滚动、完整链PPO及BC关闭均沿用。
# 必须实测本核部署时间，使用新目录和新rollout；禁止拿四步checkpoint直接resume。
# 连续滚动独立实验：继承随机20秒完整链PPO参数；禁止作为旧运行的等价resume。
# 服务器2：随机配对运动起点、冻结GMT真实预热1秒，GENMO接管后最多20秒。
# 8秒仅切PPO采集批，超时使用重置前真实状态Value；失败与音乐结束不自举。
# gamma=.95/lambda=.98，8192完整链PPO、全部16层Transformer、目标感知回溯、BC关闭。
# 保留服务器2原奖励、物理配置、模型资产与15+4+1真实噪声核；新实验必须重新校准价值。

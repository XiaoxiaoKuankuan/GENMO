# 独立十帧参考Adapter候选配置；读配置不会启动训练。
# 冻结GENMO名义缓存/Actor/normalizer；独立WM仅真实监督；首版物理单环境。
# tasks与music_baseline由显式准备/标定命令产生，禁止猜测生产资产或复用旧H16验收。
algorithm: genmo_supermimic_reference_adapter10
physics_backend: isaaclab3_newton_mujoco_warp
supermimic:
  repo: /home/weili/bumi-closedloop-worktrees/supermimic/SuperMimic
  checkpoint: /home/weili/supermimic_vibed/logs/bumi3_seven_filtered_v1/ckpt_024000.pt
  robot_asset_dir: /home/weili/supermimic_vibed/data/bumi3_4340/robot
genmo:
  checkpoint: null
  stats: /home/weili/bumi-closedloop-worktrees/stage1_server2_scratch600k_20260930/assets/qpos30_train_stats.json
  kinematics: configs/bumi/bumi_kinematics_robot_retargeter_fe934_v1.json
  bootstrap_latency_ticks: null
  latency_margin_ticks: 60
tasks: null
music_baseline: null
reference_steps: 10
hidden_dims: [512, 512, 256]
output_dim: 270
control_hz: 50
bptt_steps: 16
observation_noise: false
music:
  sigma_s: 0.04
  lag_steps: 2
  tau: 0.05
  margin: 0.01
  activity_fraction: 0.7
  activity_floor: 0.05
  match_tolerance_s: 0.06
  event_activity_floor: 0.1
  extra_event_weight: 1.0
rewards: {music: 0.2, magnitude: 0.02, smooth: 0.01, overlap: 0.02, reference_limit: 0.1, activity: 0.05}
training:
  batch_size: 64
  adapter_lr: 0.0001
  critic_lr: 0.0001
  wm_lr: 0.00003
  wm_fit_window: 8
  gamma_per_control: 0.99
  lambda_return_per_control: 0.95
  grad_clip_norm: 1.0
  critic_warmup_epochs: 20
  critic_warmup_rounds: 5
  critic_batch_size: 256
  wm_warmup_steps: 200
  wm_warmup_min_steps: 25
  wm_validation_batch_size: 32
  backward_microbatch: 1
  max_wm_relative_drift: 0.005
  min_execution_gradient: 1.0e-9
  collect_steps_per_round: 64
  replay_capacity: 20000
  seed: 42
  maximum_bounded_updates: 4
  small_audit_every: 25
  full_audit_every: 100
  checkpoint_every: 25
  critic_quality:
    min_train_samples: 128
    min_validation_samples: 64
    min_explained_variance: 0.1
    min_mse_improvement: 0.2
    min_near_failure_samples: 16
    max_near_failure_mse_ratio: 0.8
  wm_quality:
    root_position_m: 0.05
    root_rotation_rad: 0.1
    joint_position_rad: 0.1
    joint_velocity_rad_s: 2.0
  physical_monitor:
    tracking_relative_drop: 0.05
    music_absolute_drop: 0.1
    f1_absolute_drop: 0.05
  physical_audit_start_steps: [0, 50]
# 必须在实际物理审计前填写JSON阈值文件；这里不替实验决定合格阈值。
physical_criteria: null

# 独立音乐漂移修复实验，不替换旧正式运行配置，不自动启动大规模训练。
# 从source_run/checkpoints/initial_actor.pt逐张量加载原Stage1，使用新AdamW；Critic权重为0。
# 局部H16执行目标 + episode初态固定SE2累计目标；积分除以H16折扣质量0.297084。
# BC/local/global等软辅助先限制相对主梯度预算，再投影冲突；硬限位不投影。
# 4个实际音乐/时间anchor，0/10/25/50真实固定八曲评价；质量负结果完整保留。
# 路径和GPU由服务器2独立运行副本显式重定位，所有null资产必须填实际原始来源。

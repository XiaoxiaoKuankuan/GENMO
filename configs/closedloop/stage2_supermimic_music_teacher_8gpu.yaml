# 八卡正式训练覆盖配置：与已核验的音乐教师基础配置合并后交给正式启动器。
# GPU0执行Actor优化并采集一个Newton环境，GPU1至7独立真实采集；同版本合法anchor
# 汇总为8样本梯度累积，不将采集副本称作DDP。评价期间全部采集暂停，8卡按歌曲分片。
# 冻结模型、H16、教师、奖励、BC及候选AdamW回滚保持基础配置。只记录质量，不因质量
# 或拒绝次数停止；不设置墙钟/控制步预算，正常完成条件为启动器指定的有效更新总数。
training:
  actor_microbatch: 8
  replay_capacity: 512
execution:
  start_large_scale_training: true  # 用户已明确要求启动正式八卡训练。
  physical_worker_gpus: [1, 2, 3, 4, 5, 6, 7]
formal:
  evaluation_gpu: 0
  evaluation_gpus: [0, 1, 2, 3, 4, 5, 6, 7]
  reuse_collection_gpus_for_evaluation: true
  evaluate_first_update: false
  checkpoint_every: 100
  evaluate_every: 100
  max_control_steps: null
  max_wall_hours: null
  maximum_invalid_streak: 20  # 仅每20次无效更新报告；不触发停止。

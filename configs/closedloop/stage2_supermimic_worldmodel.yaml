# GENMO第二阶段：现有Stage1 + 独立未来条件 + 固定同源SM pi/wm + 上层Critic。
# 本轮只写代码，未运行测试或模型。null是必须提供的实际资产/验证结果，不是占位假权重。
# 60帧@30Hz，SM 50Hz / Newton四子步；所有路径可在独立运行副本中重定位。
algorithm: genmo_supermimic_model_based
physics_backend: isaaclab3_newton_mujoco_warp
stage1:
  checkpoint: null
  stats: /home/weili/bumi-closedloop-worktrees/stage1_server2_scratch600k_20260930/assets/qpos30_train_stats.json
  kinematics: configs/bumi/bumi_kinematics_robot_retargeter_fe934_v1.json
  data_config: null
supermimic:
  repo: /home/weili/bumi-closedloop-worktrees/supermimic/SuperMimic
  checkpoint: /home/weili/supermimic_vibed/logs/bumi3_seven_filtered_v1/ckpt_024000.pt
  robot_asset_dir: /home/weili/supermimic_vibed/data/bumi3_4340/robot
tasks: null
latency_profile: null
model:
  motion_frames: 60
  motion_fps: 30
  ddim_steps: 20
  eta: 0.0
  cfg_scale: 2.5
  forecast_enabled: true
  activation_checkpointing: true
clock:
  bootstrap_latency_ticks: null
  latency_margin_ticks: 0
  request_mode: eager
  request_interval_ticks: 300
  max_consecutive_timeouts: 3
imagination:
  decision_intervals: 3
  validated_model_steps: null
  physical_validation_report: null
critic:
  network: {width: 256, layers: 2, heads: 4}
  gamma_per_control: 0.99
training:
  genmo_lr: 0.00001
  forecast_lr: 0.0001
  critic_lr: 0.0001
  weight_decay: 0.01
  bc_weight: 1.0
  grad_clip: 1.0
  lambda_per_half_second: 0.95
  warmup_updates: 2
  stage1_supervision_step: 595000
  actor_microbatch: 1
  supervision_batch: 1
  collect_decisions: 3
  replay_capacity: 128
  seed: 42
rewards:
  mode: upper_eight
  # 尺度来自rolling configs/closedloop/stage2_continuous_rolling.yaml reward_std，非SM默认值。
  scales: {anchor_pos: 0.3, anchor_ori: 0.4, body_pos: 0.15, body_ori: 0.2, body_lin_vel: 1.0, body_ang_vel: 3.14, foot_height: 0.07, leg_joint_pos: 0.25}
  # 名称来自原已确认BUMI4340 tracking_env_cfg CommandsCfg.body_names，共22体。
  body_names: [base_link, waist_yaw_link, l_arm_pitch_link, l_arm_roll_link, l_arm_yaw_link, l_elbow_pitch_link, r_arm_pitch_link, r_arm_roll_link, r_arm_yaw_link, r_elbow_pitch_link, l_leg_pitch_link, l_leg_roll_link, l_leg_yaw_link, l_knee_pitch_link, l_ankle_pitch_link, l_ankle_roll_link, r_leg_pitch_link, r_leg_roll_link, r_leg_yaw_link, r_knee_pitch_link, r_ankle_pitch_link, r_ankle_roll_link]
  foot_names: [l_ankle_roll_link, r_ankle_roll_link]
  leg_joint_names: [l_leg_pitch_joint, l_leg_roll_joint, l_leg_yaw_joint, l_knee_pitch_joint, l_ankle_pitch_joint, l_ankle_roll_joint, r_leg_pitch_joint, r_leg_roll_joint, r_leg_yaw_joint, r_knee_pitch_joint, r_ankle_pitch_joint, r_ankle_roll_joint]
  action_rate_weight: 0.1
  joint_limit_weight: 2.0
  root_huber_weight: 0.0
  music_surrogate_enabled: false
execution:
  start_large_scale_training: false
  maximum_explicit_updates: 8
  preserve_episode_across_collection_windows: true
  physical_batch: 1

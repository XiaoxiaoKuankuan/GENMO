# 服务器2最后五个去噪步骤＋实际执行源帧PPO，从原始Stage1重新训练Stage2。
# 数据流：完整DDIM10生成30帧（音乐60帧）；0..4仅冻结Stage1，5..9全部可训练。
# 最后一步使用真实std=.02高斯采样并直接输出，不再由冻结网络覆盖，不能假造确定性概率。
# GMT实际中心及相邻控制点追溯30Hz源帧与复制前缀父计划，仅本批真正消费的自由坐标
# 进入逐步骤PPO和KL；完整远景、原始采样概率和物理奖励保留，GAE按真实控制时间。
# 未消费的本批动作没有Actor更新；旧版本参考只计物理统计，不归给新的生成决策。
# Actor初始候选LR=1e-6；须先在新核/新mask真实八卡数据上验收，不沿用旧1e-7标定。
# 新实验不加载旧Stage2 checkpoint；Critic、两Adam、采样池和预算重新建立。
# 固定整曲评价、困难采样、原物理终止阈值保留；数值通过不代表真实跟随改善。

# 第九步服务器1有限验收配置：沿用独立Isaac环境和严格第八步物理基线。
# 仅使用单张空闲GPU训练GENMO与Critic；GMT ONNX和PhysX继续CPU执行。
base_config: stage8_train200_latency_server1.yaml
runtime:
  allow_shared_gpu: false
timing:
  calibration_warmup: 4
  calibration_samples: 12
diagnostics:
  reward_substeps: true
stage9:
  version: genmo.closedloop.stage9.v1
  run_id: assigned_from_output_directory
  seed: 42
  execution_mode: latency
  denoising_steps: 20
  guidance_scale: 2.5
  eta: 0.1
  std_floor: 0.001
  log_probability_reduction: joint_sum
  rollout_upper_steps: 64
  ppo_epochs: 1
  # 首次真实joint_sum验收1e-6产生KL2964.81；这是一轮显式保守修正。
  actor_lr: 1.0e-09
  critic_lr: 0.0001
  # 同一批固定DPPO+BC梯度、同一Adam起点，最多三次独立试探；只保留最大合格候选。
  # 每次试探均占用iterations预算，不累计三步，也不修改std或joint_sum门槛。
  actor_lr_candidates: [1.0e-09, 3.0e-09, 1.0e-08]
  actor_lr_selection: largest_candidate_below_joint_kl_limit
  critic_steps: 20
  critic_batch: 32
  grad_clip_norm: 1.0
  gamma_upper: 0.99
  lambda_upper: 0.95
  gamma_denoising: 0.99
  ppo_clip: 0.01
  kl_stop_joint: 0.02
  bc_weight: 0.1
  bc_batch: 2
  denoising_microbatch: 1
  episode_seconds: 30
  latency_budget_s: 0.5
  max_generations: 256
  max_control_steps: 10000
  max_iterations: 3
  music_selection: /data0/user/liwei/closedloop_stage9_assets/corrected_selection.json
  bc_data_root: /data0/user/liwei/datasets/bumi_music_umr70_mine_pass_90505_v1
  # 与本机同一奖励定义；缺配对动作或必需诊断时明确拒绝训练转移。
  reward:
    version: stage9.execution_reward.v2
    dt: 0.02
    track_weight: 2.5
    music_weight: 2.0
    stable_weight: 1.0
    alive_weight: 0.5
    cmd_penalty_weight: 0.15
    torque_penalty_weight: 0.1
    contact_penalty_weight: 0.2
    joint_limit_penalty_weight: 0.5
    failure_penalty: 5.0
    rejected_plan_penalty: 0.5
    scales:
      root_height_m: 0.05
      non_yaw_rad: 0.12
      slide_m_s: 0.15
    tracking:
      objective: gmt.motion_tracking.v1
      # 误差来自冻结GMT当前任务的原motion-tracking定义，均为平方误差。
      # joint_pos沿用原12腿关节选择；joint_vel当前未启用，保留原函数默认全21关节。
      std:
        anchor_pos: 0.3
        anchor_ori: 0.4
        body_pos: 0.3
        body_ori: 0.4
        joint_pos: 0.25
        # 原GMT未启用velocity，此std是Stage9预留参数，默认不参与奖励。
        joint_vel: 1.4
      # 原启用比例0.5:0.5:1:1:0.5除以3.5，保持R_track在[0,1]。
      weights:
        anchor_pos: 0.14285714285714285
        anchor_ori: 0.14285714285714285
        body_pos: 0.2857142857142857
        body_ori: 0.2857142857142857
        joint_pos: 0.14285714285714285
        joint_vel: 0.0
    stable_mix:
      root_height: 0.5
      non_yaw: 0.5
    music_mix:
      beat: 0.7
      intensity: 0.3
    torque:
      free_ratio: 0.8
      mean_weight: 0.5
      max_weight: 0.5
    activity:
      window_s: 0.5
      inactive_target_rad_s: 0.1
      full_gate_ratio: 0.5
      epsilon: 1.0e-08
      intensity_epsilon: 0.05
      intensity_log_ratio: 2.0
    music:
      beat_window_s: 1.0
      feature_fps: 30
      beat_column: 34
      beat_threshold: 0.5
    contact:
      slide_weight: 0.7
      bad_contact_weight: 0.3
      support_clearance_m: 0.025
    joint_limit:
      hard_range_margin_fraction: 0.05
      numeric_tolerance_rad: 1.0e-06
      actual_weight: 0.5
      reference_weight: 0.5
    consistency:
      joint_vel_rms_rad_s: 0.0001
      root_lin_vel_rms_m_s: 0.0001
      root_ang_vel_rms_rad_s: 0.0001
    diagnostics:
      mechanical_power_weight: 0.0
      impact_weight: 0.0
    require_substeps: true

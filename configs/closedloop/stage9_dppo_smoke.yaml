# 第九步本机有限验收：继承已跑通的严格第八步环境，仅新增训练侧配置。
# 默认入口collect只采集；train才更新Critic和一次Actor。全部模式共享输出目录预算，
# 随机噪声在normalized qpos30空间定义，FP32网络与FP64联合概率，不启用混合精度。
base_config: stage8_train200_latency_isaac.yaml
runtime:
  allow_shared_gpu: false
timing:
  calibration_warmup: 4
  calibration_samples: 12
diagnostics:
  reward_substeps: true
stage9:
  version: genmo.closedloop.stage9.v1
  run_id: assigned_from_output_directory
  seed: 42
  execution_mode: latency
  denoising_steps: 20
  guidance_scale: 2.5
  eta: 0.1
  std_floor: 0.001
  log_probability_reduction: joint_sum
  rollout_upper_steps: 64
  ppo_epochs: 1
  # 首次真实joint_sum验收1e-6产生KL2964.81；仅降低步长，不放宽KL=.02或修改噪声。
  actor_lr: 0.000000001
  critic_lr: 0.0001
  # 同一批固定DPPO+BC梯度、同一Adam起点，最多三次独立试探；只保留最大合格候选。
  # 每次试探均占用iterations预算，不累计三步，也不修改std或joint_sum门槛。
  actor_lr_candidates: [1.0e-09, 3.0e-09, 1.0e-08]
  actor_lr_selection: largest_candidate_below_joint_kl_limit
  critic_steps: 20
  critic_batch: 32
  grad_clip_norm: 1.0
  gamma_upper: 0.99
  lambda_upper: 0.95
  gamma_denoising: 0.99
  ppo_clip: 0.01
  kl_stop_joint: 0.02
  bc_weight: 0.1
  bc_batch: 2
  denoising_microbatch: 1
  episode_seconds: 30
  latency_budget_s: 0.5
  max_generations: 256
  max_control_steps: 10000
  max_iterations: 3
  music_selection: /home/weili/bumi-closedloop-worktrees/GENMO/inputs/evals/stage8_train200_20260929/corrected_selection.json
  bc_data_root: /home/weili/bumi-closedloop-worktrees/GENMO/inputs/evals/stage1_fourset_20260928/training_selected_data
  # v2：连续奖励率只乘一次20ms；事件惩罚独立。配对活动度仅用于奖励。
  reward:
    version: stage9.execution_reward.v2
    dt: 0.02
    track_weight: 2.5
    music_weight: 2.0
    stable_weight: 1.0
    alive_weight: 0.5
    cmd_penalty_weight: 0.15
    torque_penalty_weight: 0.1
    contact_penalty_weight: 0.2
    joint_limit_penalty_weight: 0.5
    failure_penalty: 5.0
    rejected_plan_penalty: 0.5
    scales:
      joint_pos_rad: 0.22
      joint_vel_rad_s: 1.4
      ee_height_m: 0.07
      yaw_rad: 0.6
      root_position_m: 0.4
      root_height_m: 0.05
      non_yaw_rad: 0.12
      slide_m_s: 0.15
    track_mix:
      joint_pos: 0.45
      joint_vel: 0.25
      ee_height: 0.15
      yaw: 0.1
      root_position: 0.05
    stable_mix:
      root_height: 0.5
      non_yaw: 0.5
    music_mix:
      beat: 0.7
      intensity: 0.3
    torque:
      free_ratio: 0.8
      mean_weight: 0.5
      max_weight: 0.5
    activity:
      window_s: 0.5
      inactive_target_rad_s: 0.1
      full_gate_ratio: 0.5
      epsilon: 1.0e-08
      intensity_epsilon: 0.05
      intensity_log_ratio: 2.0
    music:
      beat_window_s: 1.0
      feature_fps: 30
      beat_column: 34
      beat_threshold: 0.5
    contact:
      slide_weight: 0.7
      bad_contact_weight: 0.3
      support_clearance_m: 0.025
    joint_limit:
      hard_range_margin_fraction: 0.05
      numeric_tolerance_rad: 1.0e-06
      actual_weight: 0.5
      reference_weight: 0.5
    consistency:
      joint_vel_rms_rad_s: 0.0001
      root_lin_vel_rms_m_s: 0.0001
      root_ang_vel_rms_rad_s: 0.0001
    diagnostics:
      mechanical_power_weight: 0.0
      impact_weight: 0.0
    require_substeps: true

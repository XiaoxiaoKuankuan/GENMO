# 训练 DataModule 配置。
# train 部分来自 train_datasets，val 部分来自 test_datasets；DataModule 会把多个
# 训练集拼接成一个 ConcatDataset，并按验证数据集顺序评估。
defaults:
  - collate_cfg: default

# definition of lightning datamodule (dataset + dataloader)
_target_: gem.datamodule.mocap_trainX_testY.DataModule

dataset_opts:
  train: ${train_datasets}
  val: ${test_datasets}
  max_motion_frames: 120

loader_opts:
  train:
    batch_size: 128
    num_workers: 8
  val:
    batch_size: 1
    num_workers: 1
  encoded_music_dim: ${pipeline.args.encoded_music_dim}

limit_each_trainset: null

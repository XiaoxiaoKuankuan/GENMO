# @package _global_
# 单集对照采用该子集train统计量，其余结构和损失与联合实验一致。
defaults:
- gem_bumi_text_fullseq
- override /train_datasets:
  - motionmillion_bumi_text_train
- override /test_datasets:
  - motionmillion_bumi_text_val
- _self_
exp_name_base: gem_bumi_motionmillion_text_crop120
data_name: bumi_motionmillion_text_crop120_v2
endecoder:
  stats_path: ${oc.env:BUMI_TEXT_STATS_PATH,inputs/bumi_text_crop120/stats_motionmillion.json}

# 单库对照使用既有分片采样，避免继承四库概率。
data:
  shard_aware_sampling:
    enabled: true
  text_sampling:
    enabled: false

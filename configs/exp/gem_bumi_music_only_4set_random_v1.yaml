# @package _global_
# Formal random-initialized BUMI-native four-dataset music-only experiment.
defaults:
  - /diffusion@model_cfg.diffusion: ddim
  - override /data: music_robot/trainX_testY
  - override /model: bumi_music_gem
  - override /network: diffusion_lg_bumi93_no_contact
  - override /pipeline: music_only_bumi_physical_v1
  - override /endecoder: bumi_93d_no_contact
  - override /optimizer: adamw_2e-4
  - override /scheduler: iters_half_300k_450k
  - override /train_datasets:
      - aistpp_bumi_balanced_train
      - aioz_gdance_bumi_balanced_train
      - finedance_bumi_balanced_train
      - compas3d_bumi_balanced_train
  - override /test_datasets:
      - aistpp_bumi_music_eval_v1
      - aioz_gdance_bumi_music_eval
      - finedance_bumi_music_eval
      - compas3d_bumi_music_eval
  - override /callbacks:
      - ckpt_saver/every10000s_top100
      - prog_bar/prog_reporter_ed1
      - train_speed_timer/base
      - lr_monitor/pl
  - _self_

exp_name_base: gem_bumi_music_only_4set_random_v1
exp_name_var: ""
exp_name: ${exp_name_base}${exp_name_var}
data_name: gem_bumi_music_only_4set_random_v1
output_dir: outputs/${exp_name}
pretrain_ckpt: null
ckpt_path: null
multicond_args: null

model:
  model_cfg:
    motion_backend: bumi
    checkpoint_adapter: null
    text_encoder: null
    music_mask_prob: 0.1
    audio_mask_prob: 0.0
    normalize_cam_angvel: false

network:
  model_cfg:
    regression_only: false
    denoiser:
      encode_text: false
      input_remove_global: false
      static_conf_dim: 0

data:
  sampling_strategy: deduplicated_hierarchical
  samples_per_epoch: 52224
  sampler_seed: ${seed}
  dataset_probability_min: 0.05
  dataset_probability_max: 0.50
  stats_path: ${oc.env:BUMI_MUSIC_STATS_PATH}
  require_stats_fingerprint_match: true
  expected_train_sequences: 5537
  loader_opts:
    train:
      batch_size: 128
      num_workers: 6
    val:
      batch_size: 1
      num_workers: 1

pl_trainer:
  precision: 16-mixed
  log_every_n_steps: 10
  gradient_clip_val: 0.5
  max_epochs: null
  check_val_every_n_epoch: null
  val_check_interval: 10000
  max_steps: 500000
  devices: 8
  strategy: ddp
  use_distributed_sampler: false

logger:
  _target_: pytorch_lightning.loggers.WandbLogger
  project: gem
  save_dir: /tmp
  name: ""
  version: ""
  resume: allow
  dir: /tmp
  id: null

use_wandb: true

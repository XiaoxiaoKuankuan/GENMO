# @package _global_
# robot_retargeter 30 Hz 四库严格 PASS 集的 qpos30/contact 八卡随机初始化训练。
#
# 该入口只使用经新契约重算关节限位、速度、加速度、jerk、Root 倾角和
# 倒地动作后的 2,455 条 train PASS。新 kinematics 与旧 GMR/自建库资产不同，因此
# 明确禁用 pretrain/resume/checkpoint adapter，避免在旧关节顺序或旧坐标统计上继续优化。
# 正式环境必须注入新四库 root、fe934 kinematics 和本次 PASS-only qpos30 stats。
defaults:
  - gem_bumi_music_only_4set_random_v1
  - override /network: diffusion_lg_bumi30_contact
  - override /pipeline: music_only_bumi_qpos30_contact_v2
  - override /endecoder: bumi_qpos30_contact
  - override /scheduler: iters_half_210k_315k
  - override /callbacks:
      - ckpt_saver/every5000s_top100
      - prog_bar/prog_reporter_ed1
      - train_speed_timer/base
      - lr_monitor/pl
  - _self_

exp_name_base: gem_bumi_music_only_4set_robot_retargeter_pass_v1_qpos30_contact_scratch_b192_s350k
exp_name_var: ""
exp_name: ${exp_name_base}${exp_name_var}
data_name: gem_bumi_music_only_4set_robot_retargeter_pass_v1_qpos30_contact_scratch_350k
output_dir: outputs/${exp_name}

pretrain_ckpt: null
ckpt_path: null
resume_mode: null

model:
  model_cfg:
    checkpoint_adapter: null

network:
  model_cfg:
    denoiser:
      static_conf_dim: 2

pipeline:
  args:
    ground_semantics: mixed_floor_zero_fk_contact_v2

data:
  expected_train_sequences: 2455
  dataset_probability_min: 0.03
  dataset_probability_max: 0.65
  dataset_sampling_weights:
    aistpp_bumi: 0.29
    aioz_gdance_bumi: 0.60
    finedance_bumi: 0.07
    compas3d_bumi: 0.04
  stats_path: ${oc.env:BUMI_MUSIC_QPOS30_STATS_PATH}
  loader_opts:
    train:
      batch_size: 192
      num_workers: 6

train_datasets:
  aistpp_bumi_train:
    joint_limit_tolerance: 0.0001
  aioz_gdance_bumi_train:
    joint_limit_tolerance: 0.0001
  finedance_bumi_train:
    joint_limit_tolerance: 0.0001
  compas3d_bumi_train:
    joint_limit_tolerance: 0.0001

test_datasets:
  aistpp_bumi_music_eval:
    joint_limit_tolerance: 0.0001
  aioz_gdance_bumi_music_eval:
    joint_limit_tolerance: 0.0001
  # PASS 筛选后 FineDance val 为空，显式使用仍有12条 PASS的 test split。
  finedance_bumi_music_eval:
    split: test
    joint_limit_tolerance: 0.0001
  compas3d_bumi_music_eval:
    joint_limit_tolerance: 0.0001

optimizer:
  lr: 0.0001

pl_trainer:
  max_steps: 350000
  val_check_interval: 5000
  devices: 8
  strategy: ddp
  use_distributed_sampler: false

use_wandb: false

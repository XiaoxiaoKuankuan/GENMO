# @package _global_
# robot_retargeter 全时域 QP 四库 PASS v2 的 qpos30/contact v3 权重续训入口。
#
# 本任务从上一轮仍在运行的 qpos30 原生模型中选择停止前最新“完整编号 checkpoint”，
# 只加载模型权重；AdamW、学习率调度器、epoch 和 global step 全部重新初始化。因此这里的
# max_steps=200000 表示额外执行 20 万个 optimizer step，不会因旧 global step 已超过 12 万
# 而提前结束。pretrain_ckpt 必须由正式启动命令显式注入，ckpt_path/resume_mode 保持为空，
# 避免误走 Lightning 全状态恢复。
#
# 数据使用全时域 QP 重定向后重新自动筛选的 2816 条 PASS，其中 train=2479；损失切换到
# physical_qpos30_contact_v3。每卡优先尝试 batch=256，8 卡全局 batch=2048；每个采样 epoch
# 固定 53248 个样本，恰好是 26 个全局 batch。若真实八卡 smoke 发生 OOM，只允许通过命令
# 行显式下调 batch，并同步调整 samples_per_epoch 后再启动正式任务。
defaults:
  - gem_bumi_music_only_4set_robot_retargeter_pass_v1_qpos30_contact_scratch_350k
  - override /pipeline: music_only_bumi_qpos30_contact_v3
  - override /optimizer: adamw_2e-5
  - override /scheduler: iters_half_120k_180k
  - _self_

exp_name_base: gem_bumi_music_only_4set_robot_retargeter_pass_v2_qpos30_contact_v3_continue_b256_s200k
exp_name_var: ""
exp_name: ${exp_name_base}${exp_name_var}
data_name: gem_bumi_music_only_4set_robot_retargeter_pass_v2_qpos30_contact_v3_continue_200k
output_dir: outputs/${exp_name}

# 正式命令注入最新编号 checkpoint；这是 weights-only 续训，不恢复旧优化器或步数。
pretrain_ckpt: null
ckpt_path: null
resume_mode: null

model:
  model_cfg:
    checkpoint_adapter: null

optimizer:
  lr: 0.00002

data:
  expected_train_sequences: 2479
  samples_per_epoch: 53248
  loader_opts:
    train:
      batch_size: 256
      num_workers: 6

pl_trainer:
  max_steps: 200000
  val_check_interval: 5000
  devices: 8
  strategy: ddp
  use_distributed_sampler: false

use_wandb: false

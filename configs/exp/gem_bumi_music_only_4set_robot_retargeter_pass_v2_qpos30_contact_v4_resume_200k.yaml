# @package _global_
# qpos30/contact v4 从v3完整checkpoint原状态恢复、继续到全局20万步的正式入口。
#
# 启动时必须把resume_mode显式设为经校验的v3完整checkpoint绝对路径，同时把
# pipeline.args.robust_joint_limit_start_step设为该checkpoint内部global_step。这样模型、
# optimizer、scheduler和全局step完整延续，而新增安全边距/top-k/max项从0开始用5000步
# 平滑接入；禁止使用pretrain_ckpt或ckpt_path，避免意外变成weights-only的新计步任务。
defaults:
  - gem_bumi_music_only_4set_robot_retargeter_pass_v2_qpos30_contact_v3_continue_200k
  - override /pipeline: music_only_bumi_qpos30_contact_v4
  - _self_

exp_name_base: gem_bumi_music_only_4set_robot_retargeter_pass_v2_qpos30_contact_v4_resume_s200k
exp_name_var: ""
exp_name: ${exp_name_base}${exp_name_var}
data_name: gem_bumi_music_only_4set_robot_retargeter_pass_v2_qpos30_contact_v4_resume_200k
output_dir: outputs/${exp_name}

pretrain_ckpt: null
ckpt_path: null
resume_mode: null

model:
  model_cfg:
    checkpoint_adapter: null

pl_trainer:
  max_steps: 200000

# @package _global_
# BUMI 五库 qpos30/contact/FK 物理约束模型的 350k、8 卡、完全从零训练入口。
#
# 本配置把“禁止加载旧模型”固化为配置契约：pretrain_ckpt、ckpt_path、resume_mode 与
# checkpoint_adapter 均为 null，既不迁移 main/SMPL 音乐模型，也不恢复旧 BUMI checkpoint
# 或 optimizer/global step。网络的 30 维 qpos 输出、2 维接触 head 和 Transformer 主干全部
# 随机初始化。每卡 batch=192、8 卡全局 batch=1536，训练 350k step；学习率在 210k/315k
# 衰减，保持父实验 350k 预算的 60%/90% 相对里程碑。该配置与旧 93D 输出不兼容，只允许
# 使用 genmo.bumi_qpos30_stats.v3 五库统计量。
defaults:
  - gem_bumi_music_only_5set_manual_q1_v3
  - override /network: diffusion_lg_bumi30_contact
  - override /pipeline: music_only_bumi_qpos30_contact_v2
  - override /endecoder: bumi_qpos30_contact
  - override /scheduler: iters_half_210k_315k
  - override /callbacks:
      - ckpt_saver/every5000s_top100
      - prog_bar/prog_reporter_ed1
      - train_speed_timer/base
      - lr_monitor/pl
  - _self_

exp_name_base: gem_bumi_music_only_5set_manual_q1_v3_qpos30_contact_scratch_b192_s350k
exp_name_var: ""
exp_name: ${exp_name_base}${exp_name_var}
data_name: gem_bumi_music_only_5set_manual_q1_v3_qpos30_contact_scratch_350k
output_dir: outputs/${exp_name}

# 四个入口全部为空，保证本实验只能从随机初始化的 step 0 开始。
pretrain_ckpt: null
ckpt_path: null
resume_mode: null

model:
  model_cfg:
    checkpoint_adapter: null

# 父实验为历史 no-contact 网络，需恢复两维接触 head。
network:
  model_cfg:
    denoiser:
      static_conf_dim: 2

# 父实验是无接触 ground 语义；qpos30 使用 FK 足底标签与接触/足滑损失。
pipeline:
  args:
    ground_semantics: mixed_floor_zero_fk_contact_v2

data:
  stats_path: ${oc.env:BUMI_MUSIC_QPOS30_STATS_PATH}
  loader_opts:
    train:
      batch_size: 192

optimizer:
  lr: 0.0001

pl_trainer:
  max_steps: 350000
  val_check_interval: 5000
  devices: 8
  strategy: ddp
  use_distributed_sampler: false

use_wandb: false

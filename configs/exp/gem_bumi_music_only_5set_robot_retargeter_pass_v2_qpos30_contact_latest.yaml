# @package _global_
# 当前唯一的 BUMI3 robot_retargeter 五库 qpos30/contact 正式恢复训练入口。
#
# 四个公开库使用 robot_retargeter 全时域 QP 后的 PASS-v2 数据；自建库使用同一 fe934
# kinematics，先按关节名把旧 CSV 的“腿、腰、手臂”顺序转换成当前 MuJoCo 的
# “腰、手臂、腿”顺序，再重采样、限位对齐、重算接触。正式命令必须把 resume_mode
# 指向 s120000 完整 checkpoint；模型、AdamW、scheduler、epoch 和 global step 全状态恢复，
# max_steps=220000 表示从全局 120000 再训练 100000 step，禁止改用 pretrain_ckpt。
#
# s120000 末段日志中，加速度匹配、加速度超额和平均限位的加权贡献只有约 3.9e-5、
# 9.6e-5 和 1.5e-5，因此只把这几类及 v4 的 margin/top-k/max 限位保护提高 2 倍；
# jerk、脚滑和三项主表示重建损失保持原权重，避免为了物理项牺牲舞蹈相似性。
defaults:
  - gem_bumi_music_only_4set_random_v1
  - override /network: diffusion_lg_bumi30_contact
  - override /pipeline: music_only_bumi_qpos30_contact_v4
  - override /endecoder: bumi_qpos30_contact
  - override /optimizer: adamw_2e-5
  - override /scheduler: iters_half_120k_180k
  - override /train_datasets:
      - aistpp_bumi_balanced_train
      - aioz_gdance_bumi_balanced_train
      - finedance_bumi_balanced_train
      - compas3d_bumi_balanced_train
      - mine_bumi_balanced_train
  - override /test_datasets:
      - aistpp_bumi_music_eval_v1
      - aioz_gdance_bumi_music_eval
      - finedance_bumi_music_eval
      - compas3d_bumi_music_eval
  - override /callbacks:
      - ckpt_saver/every5000s_top100
      - prog_bar/prog_reporter_ed1
      - train_speed_timer/base
      - lr_monitor/pl
  - _self_

exp_name_base: gem_bumi_music_only_5set_robot_retargeter_pass_v2_qpos30_contact_resume_s120k_to_s220k
exp_name_var: ""
exp_name: ${exp_name_base}${exp_name_var}
data_name: gem_bumi_music_only_5set_robot_retargeter_pass_v2_qpos30_contact_latest
output_dir: outputs/${exp_name}

pretrain_ckpt: null
ckpt_path: null
resume_mode: null

model:
  model_cfg:
    checkpoint_adapter: null

network:
  model_cfg:
    denoiser:
      static_conf_dim: 2

pipeline:
  args:
    ground_semantics: mixed_floor_zero_fk_contact_v2
    robust_joint_limit_start_step: 120000
    robust_joint_limit_warmup_steps: 5000
    weights:
      joint_acceleration: 0.02
      joint_acceleration_excess: 0.10
      joint_limit: 0.20
      joint_limit_margin: 0.40
      joint_limit_topk: 1.00
      joint_limit_max: 0.10

data:
  expected_train_sequences: 2578
  samples_per_epoch: 53248
  dataset_probability_min: 0.03
  dataset_probability_max: 0.65
  dataset_sampling_weights:
    aistpp_bumi: 0.28
    aioz_gdance_bumi: 0.57
    finedance_bumi: 0.065
    compas3d_bumi: 0.035
    mine_bumi: 0.05
  stats_path: ${oc.env:BUMI_MUSIC_QPOS30_STATS_PATH}
  require_stats_fingerprint_match: true
  loader_opts:
    train:
      batch_size: 256
      num_workers: 6

train_datasets:
  aistpp_bumi_train:
    joint_limit_tolerance: 0.0001
  aioz_gdance_bumi_train:
    joint_limit_tolerance: 0.0001
  finedance_bumi_train:
    joint_limit_tolerance: 0.0001
  compas3d_bumi_train:
    joint_limit_tolerance: 0.0001
  mine_bumi_train:
    joint_limit_tolerance: 0.0001

test_datasets:
  aistpp_bumi_music_eval:
    joint_limit_tolerance: 0.0001
  aioz_gdance_bumi_music_eval:
    joint_limit_tolerance: 0.0001
  # PASS-v2 的 FineDance val 为空，沿用仍有 12 条 PASS 的 test split。
  finedance_bumi_music_eval:
    split: test
    joint_limit_tolerance: 0.0001
  compas3d_bumi_music_eval:
    joint_limit_tolerance: 0.0001

optimizer:
  lr: 0.00002

pl_trainer:
  max_steps: 220000
  val_check_interval: 5000
  devices: 8
  strategy: ddp
  use_distributed_sampler: false

use_wandb: false

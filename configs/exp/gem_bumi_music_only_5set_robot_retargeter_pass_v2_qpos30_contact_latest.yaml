# @package _global_
# 当前唯一的 BUMI3 robot_retargeter 五库 qpos30/contact 物理强化续训入口。
#
# 四个公开库使用 robot_retargeter 全时域 QP 后的 PASS-v2 数据；自建库使用同一 fe934
# kinematics，先按关节名把旧 CSV 的“腿、腰、手臂”顺序转换成当前 MuJoCo 的
# “腰、手臂、腿”顺序，再重采样、限位对齐、重算接触。正式命令必须把环境变量
# BUMI_PRETRAIN_CKPT 指向本次已核验的最新完整编号checkpoint；仅加载模型权重，AdamW、
# scheduler、epoch和global step从0重新开始，max_steps=200000明确表示额外训练20万step。
#
# v5在不改变网络参数形状的前提下强化脚滑、接触脚高度、穿地、限位长尾以及关节/FK/
# 根位姿动态连续性。主要表示损失保持原权重；长尾项与既有辅助项分别渐进启用，避免
# 从已收敛模型切换目标时突然压过音乐动作相似性。该入口不接受resume_mode真状态恢复，
# 因为旧scheduler已完成原阶段里程碑且不适合新的20万step优化周期。
defaults:
  - gem_bumi_music_only_4set_random_v1
  - override /network: diffusion_lg_bumi30_contact
  - override /pipeline: music_only_bumi_qpos30_contact_v5
  - override /endecoder: bumi_qpos30_contact
  - override /optimizer: adamw_2e-5
  - override /scheduler: iters_half_120k_180k
  - override /train_datasets:
      - aistpp_bumi_balanced_train
      - aioz_gdance_bumi_balanced_train
      - finedance_bumi_balanced_train
      - compas3d_bumi_balanced_train
      - mine_bumi_balanced_train
  - override /test_datasets:
      - aistpp_bumi_music_eval_v1
      - aioz_gdance_bumi_music_eval
      - finedance_bumi_music_eval
      - compas3d_bumi_music_eval
  - override /callbacks:
      - ckpt_saver/every5000s_top100
      - prog_bar/prog_reporter_ed1
      - train_speed_timer/base
      - lr_monitor/pl
  - _self_

exp_name_base: gem_bumi_music_only_5set_robot_retargeter_pass_v2_qpos30_contact_v5_continue_b256_s200k
exp_name_var: ""
exp_name: ${exp_name_base}${exp_name_var}
data_name: gem_bumi_music_only_5set_robot_retargeter_pass_v2_qpos30_contact_latest
output_dir: outputs/${exp_name}

pretrain_ckpt: ${oc.env:BUMI_PRETRAIN_CKPT}
ckpt_path: null
resume_mode: null

model:
  model_cfg:
    checkpoint_adapter: null

network:
  model_cfg:
    denoiser:
      static_conf_dim: 2

pipeline:
  args:
    ground_semantics: mixed_floor_zero_fk_contact_v2
    robust_joint_limit_start_step: 0
    robust_joint_limit_warmup_steps: 10000
    advanced_physics_start_step: 0
    advanced_physics_warmup_steps: 10000
    advanced_physics_topk_fraction: 0.05
    weights:
      joint_velocity: 0.15
      joint_acceleration: 0.04
      joint_jerk: 0.006
      joint_acceleration_excess: 0.20
      joint_jerk_excess: 0.006
      joint_limit: 0.40
      joint_limit_margin: 0.80
      joint_limit_topk: 2.00
      joint_limit_max: 0.20
      foot_slide: 0.10
      penetration: 0.10
      root_height: 0.15

data:
  expected_train_sequences: 2578
  samples_per_epoch: 53248
  dataset_probability_min: 0.03
  dataset_probability_max: 0.65
  dataset_sampling_weights:
    aistpp_bumi: 0.28
    aioz_gdance_bumi: 0.57
    finedance_bumi: 0.065
    compas3d_bumi: 0.035
    mine_bumi: 0.05
  stats_path: ${oc.env:BUMI_MUSIC_QPOS30_STATS_PATH}
  require_stats_fingerprint_match: true
  loader_opts:
    train:
      batch_size: 256
      num_workers: 6

train_datasets:
  aistpp_bumi_train:
    joint_limit_tolerance: 0.0001
  aioz_gdance_bumi_train:
    joint_limit_tolerance: 0.0001
  finedance_bumi_train:
    joint_limit_tolerance: 0.0001
  compas3d_bumi_train:
    joint_limit_tolerance: 0.0001
  mine_bumi_train:
    joint_limit_tolerance: 0.0001

test_datasets:
  aistpp_bumi_music_eval:
    joint_limit_tolerance: 0.0001
  aioz_gdance_bumi_music_eval:
    joint_limit_tolerance: 0.0001
  # PASS-v2 的 FineDance val 为空，沿用仍有 12 条 PASS 的 test split。
  finedance_bumi_music_eval:
    split: test
    joint_limit_tolerance: 0.0001
  compas3d_bumi_music_eval:
    joint_limit_tolerance: 0.0001

optimizer:
  lr: 0.00002

pl_trainer:
  max_steps: 200000
  val_check_interval: 5000
  devices: 8
  strategy: ddp
  use_distributed_sampler: false

use_wandb: false

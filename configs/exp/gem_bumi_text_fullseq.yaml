# @package _global_
# BUMI四库文本：源动作完整保存，训练随机120帧窗口，验证固定中心窗口。
# BONES按事件caption区间取窗；短窗口mask补齐，MM采样概率最低。文件名保留旧入口兼容。
# 本文本专用分支只保留这一个实验入口，直接选择实际组件，不再继承其他实验配置。
# 模型、优化器、精度、文本维度及验证频率均显式列出，合并前后有效参数保持一致。
defaults:
- /diffusion@model_cfg.diffusion: ddim
- override /data: mocap/trainX_testY
- override /model: gem
- override /optimizer: adamw_2e-4
- override /scheduler: warmup_cosine_300k
- override /network: diffusion_lg_bumi30_contact
- override /pipeline: text_only_bumi_qpos30
- override /endecoder: bumi_qpos30_contact
- override /train_datasets:
  - motionmillion_bumi_text_train
  - humanml3d_bumi_text_train
  - kitml_bumi_text_train
  - bones_seed_bumi_text_train
- override /test_datasets:
  - motionmillion_bumi_text_val
  - humanml3d_bumi_text_val
  - kitml_bumi_text_val
  - bones_seed_bumi_text_val
- override /callbacks:
  - ckpt_saver/every10000s_top100
  - prog_bar/prog_reporter_ed1
  - train_speed_timer/base
  - lr_monitor/pl
- _self_
exp_name_base: gem_bumi_text_crop120
exp_name_var: ""
exp_name: ${exp_name_base}${exp_name_var}
seed: 20260909
multicond_args: null
use_wandb: false
data_name: bumi_text_crop120_v2
output_dir: outputs/${data_name}/${exp_name}
pretrain_ckpt: null
ckpt_path: null
resume_mode: null
training_budget:
  max_steps: 215000
  warmup_steps: 5000
  auxiliary_warmup_steps: 10000
model:
  model_cfg:
    sampling_contract: ${data.text_sampling}
    noisy_2d_obs: false
    perframe_condition_exists: false
    train2d_mask_invis_obs: false
    mask_occluded_imgfeats: false
    use_cond_exists_as_input: false
    normalize_cam_angvel: false
    text_encoder:
      load_llm: false
      llm_version: t5-3b
      max_text_len: 150
    condition_mask:
      mask_text_prob:
        diffusion: 0.0
      mask_img_prob: 0.0
      mask_cam_prob: 0.0
      mask_f_imgseq_prob: 0.0
      reuse_regression_mask: false
      regression_no_img_mask: false
    music_mask_prob: 0.0
    audio_mask_prob: 0.0
    sequence_contract:
      schema_version: 2
      sequence_mode: crop
      # v2记录实际有效窗口范围；完整源动作不设300帧上限。
      min_frames: 4
      max_frames: 120
      pad_to_frames: ${data.dataset_opts.max_motion_frames}
      fps: 30
      attention_mode: ${network.model_cfg.denoiser.attention_mode}
      attention_max_len: ${network.model_cfg.denoiser.max_len}
      loss_reduction: ${pipeline.args.loss_reduction}
      train_caption_sampling: random
      val_caption_sampling: first
    motion_backend: bumi
    body_model: bumi
    train_modes:
    - diffusion
  _target_: gem.bumi_text_gem.BumiTextGEM
network:
  model_cfg:
    regression_only: false
    denoiser:
      max_len: 120
      attention_mode: valid_length
      encode_text: true
      encoded_text_dim: 1024
      text_mask_prob: 0.1
      music_mask_prob: 0.0
      speech_mask_prob: 0.0
      use_text_pos_enc: true
      allow_autoregressive: false
      text_encoder_cfg:
        mode: all
        cross_attn_type: mha
pipeline:
  args:
    extract_features: false
    regression_only: false
    loss_reduction: valid_per_sample
data:
  dataset_opts:
    max_motion_frames: 120
  shard_aware_sampling:
    enabled: false
    seed: 20260909
    shuffle: true
  text_sampling:
    enabled: true
    seed: 20260922
    samples_per_epoch: 262144
    dataset_probabilities:
      motionmillion: 0.05
      humanml3d: 0.25
      kitml: 0.10
      bones_seed: 0.60
  collate_cfg:
    default_seq_feature_dim:
      text_embed: [150, 1024]
      text_attention_mask: [150]
    default_seq_feature_length_multiplier:
      audio_array: 1
  loader_opts:
    train:
      batch_size: 64
      num_workers: 4
    val:
      batch_size: 1
      num_workers: 1
pl_trainer:
  devices: 8
  precision: bf16-mixed
  log_every_n_steps: 10
  gradient_clip_val: 0.5
  check_val_every_n_epoch: null
  val_check_interval: 5000
  use_distributed_sampler: false
  accumulate_grad_batches: 4
  max_epochs: -1
  max_steps: ${training_budget.max_steps}
scheduler:
  scheduler:
    total_steps: ${training_budget.max_steps}
    warmup_steps: ${training_budget.warmup_steps}
callbacks:
  ckpt_saver:
    every10000s_top100:
      save_on_train_end: true
endecoder:
  kinematics_path: ${oc.env:BUMI_KINEMATICS_PATH,configs/bumi/bumi_kinematics_robot_retargeter_fe934_v1.json}
  stats_path: ${oc.env:BUMI_TEXT_STATS_PATH,inputs/bumi_text_crop120/stats.json}
  # 编解码保留有效长度边界处理；与Dataset的crop取样模式是不同职责。
  sequence_mode: full

# @package _global_
# MotionMillion 同数据/同目标的独立续训阶段。完整恢复模型、AdamW 动量和绝对步数，
# 从 s210000 起追加 20000 步；旧实验目录保持完整。新阶段显式替换学习率调度，
# 固定样本/种子的轻量质量监控负责对照与早停，不宣称官方 FID 或语义检索评测。
defaults:
  - gem_smpl_motionmillion_text_only
  - _self_

exp_name_base: gem_smpl_motionmillion_continue
resume_mode: ???
continuation:
  start_step: 210000
  stage_steps: 20000

pl_trainer:
  max_epochs: -1
  max_steps: ${eval:'${continuation.start_step} + ${continuation.stage_steps}'}
  # 固定监控由 callback 在绝对步数触发，关闭旧的 16 条无指标验证循环。
  limit_val_batches: 0

scheduler:
  scheduler:
    _target_: gem.utils.lr_scheduler.ContinuationWarmupCosineLR
    # Hydra 递归合并保留旧字段，显式置空并由新调度器检查。
    total_steps: null
    start_step: ${continuation.start_step}
    stage_steps: ${continuation.stage_steps}
    warmup_steps: 1000
    peak_lr: 1.0e-5
    min_lr: 2.0e-6

callbacks:
  ckpt_saver:
    every10000s_top100:
      every_n_steps: 5000
      save_on_train_end: true
  quality_monitor:
    _target_: gem.callbacks.motionmillion_quality.MotionMillionQualityMonitor
    output_dir: ${output_dir}/quality_monitor
    dataset_cfg: ${test_datasets.motionmillion_text_val}
    collate_cfg: ${data.collate_cfg}
    cohort_size: 32
    seeds: [20260916, 20260917, 20260918, 20260919]
    every_n_steps: 5000
    patience: 3
    min_relative_improvement: 0.002
    min_diversity_ratio: 0.9
    max_slide_ratio: 1.1
    slide_tolerance: 0.005

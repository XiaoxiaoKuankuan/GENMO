# @package _global_
# 路线A0：完整文本 ↔ 完整60—300帧动作。沿用原网络、151D、T5和所有loss权重。
# 300是padding长度，120是有效帧局部注意力范围；稠密计算仍随300帧增大。
# 每卡64×8卡×累积4=2048只是待显存验证的候选，不代表已在GPU通过。
defaults:
  - gem_smpl_motionmillion_text_only
  - override /train_datasets: [motionmillion_text_fullseq_train]
  - override /test_datasets: [motionmillion_text_fullseq_val]
  - _self_

exp_name_base: gem_smpl_motionmillion_text_fullseq
data_name: motionmillion_text_fullseq_a0
output_dir: outputs/${data_name}/${exp_name}
pretrain_ckpt: null
ckpt_path: null
resume_mode: null

# 命令行统一改training_budget，可同步改变优化器步数与调度器；warmup不得超过预算。
training_budget:
  max_steps: 215000
  warmup_steps: 5000

model:
  model_cfg:
    sequence_contract:
      schema_version: 1
      sequence_mode: ${train_datasets.motionmillion_text_fullseq_train.sequence_mode}
      min_frames: 60
      max_frames: 300
      pad_to_frames: ${data.dataset_opts.max_motion_frames}
      fps: 30
      attention_mode: ${network.model_cfg.denoiser.attention_mode}
      attention_max_len: ${network.model_cfg.denoiser.max_len}
      loss_reduction: ${pipeline.args.loss_reduction}
      train_caption_sampling: ${train_datasets.motionmillion_text_fullseq_train.caption_sampling}
      val_caption_sampling: ${test_datasets.motionmillion_text_fullseq_val.caption_sampling}

network:
  model_cfg:
    denoiser:
      max_len: 120
      attention_mode: valid_length

pipeline:
  args:
    loss_reduction: valid_per_sample

data:
  dataset_opts:
    max_motion_frames: 300
  collate_cfg:
    # text-only没有原始语音；占位字段保持每动作帧一个零，不分配300×600音频采样。
    default_seq_feature_length_multiplier:
      audio_array: 1
  loader_opts:
    train:
      batch_size: 64
    val:
      batch_size: 1

pl_trainer:
  devices: 8
  use_distributed_sampler: false
  accumulate_grad_batches: 4
  max_epochs: -1
  max_steps: ${training_budget.max_steps}

scheduler:
  scheduler:
    total_steps: ${training_budget.max_steps}
    warmup_steps: ${training_budget.warmup_steps}

callbacks:
  ckpt_saver:
    every10000s_top100:
      save_on_train_end: true

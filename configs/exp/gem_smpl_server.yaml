# @package _global_
# 服务器完整 GEM-SMPL 训练配置。
# 保留 regression、diffusion、图像、2D、相机、文本、音乐和语音条件；当前本地/服务器
# 数据没有 inputs/3DPW/hmr4d_support/imgfeats/3dpw_occ_train，因此仅移除额外的
# 3DPW-OCC 遮挡增强训练源及其 metric，不改变模型结构或其余正式数据集。
defaults:
  - /diffusion@model_cfg.diffusion: ddim
  - override /data: mocap/trainX_testY
  - override /model: gem
  - override /network: diffusion_lg
  - override /pipeline: dual_mode
  - override /endecoder: v1_smpl_amass_bedlam
  - override /optimizer: adamw_2e-4
  - override /scheduler: epoch_half_500_750
  - override /train_datasets:
      - amass_v11
      - bedlam_v2
      - h36m_v1
      - 3dpw_v1
      - aistpp_train
      - beat2_static_train
      - humanml3d_static_train
  - override /test_datasets:
      - emdb1_v1_fliptest
      - emdb2_v1_fliptest
      - 3dpw_fliptest
      - rich_all
  - override /callbacks:
      - ckpt_saver/every10000s_top100
      - prog_bar/prog_reporter_ed1
      - train_speed_timer/base
      - lr_monitor/pl
      - metric/metric_emdb1
      - metric/metric_emdb2
      - metric/metric_3dpw
      - vis/vis_text
      - metric/metric_rich
  - _self_

exp_name_base: gem_smpl_server
exp_name_var: ""
exp_name: ${exp_name_base}${exp_name_var}
data_name: gem_mixed

train_datasets:
  aistpp_train:
    feat_version: v2

multicond_args: null

model:
  model_cfg:
    body_model: smplx

    text_encoder:
      load_llm: false
      llm_version: "t5-3b"
      max_text_len: 50

    condition_mask:
      mask_img_prob: 0.5
      mask_cam_prob: 1.0
      reuse_regression_mask: false
      regression_no_img_mask: true

    mask_cfg:
      drop_prob: 0.75
      max_num_drops: 3
      min_drop_nframes: 1
      max_drop_nframes: 30
    body_mask_cfg:
      drop_prob: 0.75
      joint_drop_prob: 0.25
      max_num_drops: 3
      min_drop_nframes: 1
      max_drop_nframes: 30
    music_mask_prob: 0.1
    audio_mask_prob: 0.1

network:
  model_cfg:
    regression_only: false
    denoiser:
      args: ${pipeline.args}
      encode_text: true
      encoded_text_dim: 1024
      text_encoder_cfg:
        mode: all
        cross_attn_type: mha

pipeline:
  args:
    extract_features: false
    regression_only: false

data:
  loader_opts:
    train:
      # batch_size 是每个 GPU/进程的 batch；8 卡时全局 batch 为 8 × 128 = 1024。
      # 单卡调试只需覆盖 pl_trainer.devices=1，单卡 batch 仍保持 128。
      batch_size: 128
      num_workers: 4

pl_trainer:
  precision: 16-mixed
  # 单机 8 卡默认由 Lightning 的 auto strategy 选择 DDP；覆盖 devices=1 时
  # 自动退化为单 GPU，不需要维护另一份配置。
  strategy: auto
  num_nodes: 1
  log_every_n_steps: 10
  gradient_clip_val: 0.5
  max_epochs: null
  check_val_every_n_epoch: null
  val_check_interval: 3000
  max_steps: 500000
  devices: 8

logger:
  _target_: pytorch_lightning.loggers.WandbLogger
  project: "gem"
  save_dir: "/tmp"
  name: ""
  version: ""
  resume: "allow"
  dir: "/tmp"
  id: null

use_wandb: true

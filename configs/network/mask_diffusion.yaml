# 带局部姿态 mask 的扩散网络配置。
# 这是 diffusion_lg 的变体，额外开启 mask_localpose，用于需要在采样或训练时遮蔽
# 局部姿态输入的实验。
_target_: gem.network.gem_diffusion.GEMDiffusion
args: ${pipeline.args}
latent_dim: ${.model_cfg.denoiser.latent_dim}
cond_merge_strategy: "add"
music_mask_prob: ${.model_cfg.denoiser.music_mask_prob}
speech_mask_prob: ${.model_cfg.denoiser.speech_mask_prob}
encoded_music_dim: ${pipeline.args.encoded_music_dim}
mask_localpose: true
mask_localpose_prob: 0.1
model_cfg:
  diffusion: ${model_cfg.diffusion}
  denoiser:
    _target_: gem.network.gem_denoiser.NetworkEncoderRoPE
    output_dim: 151
    xt_dim: ${.output_dim}
    njoints: ${.xt_dim}
    text_mask_prob: 0.1
    music_mask_prob: 0.1
    speech_mask_prob: 0.1
    use_text_pos_enc: true
    text_encoder_cfg:
      mode: all
      cross_attn_type: mha
    latent_dim: 1024
    num_layers: 16
    num_heads: 8
    mlp_ratio: 4

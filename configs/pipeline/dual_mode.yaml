# 双模式 Pipeline 配置。
# 完整 gem_smpl 实验使用它同时训练 regression 与 diffusion，并启用图像、2D、相机、
# 音乐、音频等条件输入；weights 字段定义 pipeline 内各监督损失的权重。
_target_: gem.pipeline.gem_pipeline.Pipeline
args_denoiser3d: ${network}
args:
  train_modes: ["regression", "diffusion"]
  endecoder_opt: ${endecoder}
  use_regression_outputs_prob: 0.
  use_cfg_sampler_for_gen: true
  inpaint_x_start_gt: false
  regression_only: false
  encoded_music_dim: 35
  multicond_args: ${multicond_args}
  infer_version: 2
  weights:
    cr_j3d: 500.
    transl_c: 1.
    cr_verts: 500.
    j2d: 1000.
    j2d_17: 1000.
    verts2d: 1000.

    proj_gt_j2d_to_bi01: true

    transl_w: 1.
    static_conf_bce: 1.

  static_conf:
    vel_thr: 0.15

  in_attr:
    - obs
    - f_cliffcam
    - f_imgseq
    - f_cam_angvel
    - encoded_music
    - encoded_audio
  mask_out_attr: [] # ${.in_attr}
  out_attr:
    pred_cam: 3

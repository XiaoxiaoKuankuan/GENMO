# Music-only specialist Pipeline.  The condition architecture contains exactly one
# condition token source: precomputed EDGE baseline35 music features.
_target_: gem.pipeline.gem_pipeline.Pipeline
args_denoiser3d: ${network}
args:
  train_modes:
    - diffusion
  endecoder_opt: ${endecoder}
  use_regression_outputs_prob: 0.
  use_cfg_sampler_for_gen: true
  inpaint_x_start_gt: false
  regression_only: false
  encoded_music_dim: 35
  multicond_args: ${multicond_args}
  infer_version: 2

  # One sample-level music drop is used to train the CFG unconditional branch.
  # Disable the legacy per-frame random-null pass to avoid double dropout.
  disable_random_null_condition: true

  # Keep the complete 151D motion/geometric/contact supervision used by dual_mode.
  weights:
    cr_j3d: 500.
    transl_c: 1.
    cr_verts: 500.
    j2d: 1000.
    j2d_17: 1000.
    verts2d: 1000.
    proj_gt_j2d_to_bi01: true
    transl_w: 1.
    static_conf_bce: 1.

  static_conf:
    vel_thr: 0.15

  in_attr:
    - encoded_music
  mask_out_attr: []
  out_attr:
    pred_cam: 3

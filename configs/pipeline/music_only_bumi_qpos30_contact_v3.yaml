# BUMI qpos30/contact v3 时序连续性与超额导数训练管线。
#
# 本配置完整继承 v2 的 30D 表示、可微 FK、接触 BCE、GT 接触门控脚滑、穿透与根姿态
# 监督，只调整关节时序项。速度、加速度和 jerk 的 GT 匹配权重提高到 0.10、0.01、
# 0.003；新增 acceleration/jerk 超额项，只在预测导数绝对值超过同帧 GT 时产生梯度，
# 避免像无条件零目标正则那样把正常快速舞蹈一并压平。超额项沿用 180 rad/s^2 与
# 600 rad/s^3 的归一化尺度，并与其他辅助物理项一起在前 5000 step 渐进启用。
_target_: gem.pipeline.bumi_music_pipeline.BumiMusicPipeline
args_denoiser3d: ${network}
args:
  motion_backend: bumi
  train_modes: [diffusion]
  endecoder_opt: ${endecoder}
  use_cfg_sampler_for_gen: true
  encoded_music_dim: 35
  in_attr: [encoded_music]
  mask_out_attr: []
  out_attr:
    static_conf_logits: 2
  loss_contract: physical_qpos30_contact_v3
  auxiliary_warmup_steps: 5000
  ground_semantics: mixed_floor_zero_fk_contact_v2
  weights:
    repr_root_pos: 1.0
    repr_root_rot: 2.0
    repr_joint: 1.0
    root_pos: 0.2
    root_rot: 1.0
    root_tilt: 1.0
    joint_dof: 0.2
    fk_body_pos: 1.0
    joint_velocity: 0.10
    joint_acceleration: 0.01
    joint_jerk: 0.003
    joint_acceleration_excess: 0.05
    joint_jerk_excess: 0.003
    joint_limit: 0.1
    contact_bce: 1.0
    foot_slide: 0.05
    penetration: 0.05
    root_height: 0.1

aistpp_bumi_train:
  _target_: gem.datasets.music_dance.music_dance_bumi.BumiMusicDanceDataset
  root: ${oc.env:AISTPP_BUMI_ROOT}
  dataset_name: aistpp_bumi
  kinematics_path: ${oc.env:BUMI_KINEMATICS_PATH}
  split: train
  motion_frames: 120
  duration_aware_sampling: true
  strict_alignment: true
  strict_contract: true
  require_quality_filter: true
  validate_payloads_on_init: true

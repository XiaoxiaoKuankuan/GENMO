# AIST++ 训练数据集配置。
# 指向 AISTPlusPlusSmplDataset，完整 gem_smpl 训练用它学习音乐/舞蹈条件动作。
aistpp_train:
  _target_: gem.datasets.aistpp.aistplusplus.AISTPlusPlusSmplDataset
  feat_version: v2
  # Preserve the upstream AIST++ behavior unless an experiment explicitly
  # opts in after validating its world-space SMPL motion.
  enable_contact_supervision: false

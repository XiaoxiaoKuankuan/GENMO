# A0 训练：复用旧完整分片，完整动作配原caption；仅尾部padding，文本独立随机抽样。
# motion_frames=120 是要核对的旧release字段，不是本实验的张量长度。
motionmillion_text_fullseq_train:
  _target_: gem.datasets.pure_motion.motionmillion.MotionMillionDataset
  root: inputs/MotionMillion
  split: train
  motion_frames: 120
  sequence_mode: full
  pad_to_frames: 300
  caption_sampling: random
  motion_manifest_path: inputs/MotionMillion/genmo_smpl_v1/manifests/train.json
  embedding_manifest_path: inputs/MotionMillion/t5_3b_v1_fp16/manifests/train.json
  shard_cache_size: 2
  random_seed: 20260909
  source_up_axis: y
  cam_augmentation: static

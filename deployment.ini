# BUMI 部署统一配置：用编辑器修改，重启 Bridge 和 GENMO 后生效。
# 模型路径相对于本文件。GMT policy 由 GMT 自己的 launch 决定，此处不配置。
# 通过 run.sh 启动时使用本文件的显式地址，不受终端 ROS_MASTER_URI 影响。

[runtime]
# gmt 联动已有 Bridge；preview 仅本地播放，无需 Bridge/Redis/ROS/GMT。
mode = gmt

[preview]
enabled = true
robot_manifest = assets/bumi_viewer/manifest.json

[model]
manifest = models/bumi_v5_s350000/deployment.json
device = cuda:0
ddim_steps = 20
guidance_scale = 2.5

[bridge]
# GENMO 和 Bridge 共用这里的地址，7022 只改这一处。
host = 127.0.0.1
port = 7022
audio_playback = ffplay

[redis]
# 这里必须和 Redis 服务、GMT 的 gmt_redis_* 配置一致。
host = 127.0.0.1
port = 6379
db = 0
key = gmt_online_frame_bumi
# ACK 共用此端口，key 自动为上面的 key 加 _ack。

[gmt]
# 11311 是 ROS 1 master/参数服务端口，仅用于读取 GMT 当前的策略路径。
ros_master_uri = http://127.0.0.1:11311
container = noetic
# GMT 不在容器时可将 container 留空；本机可直接读取策略时不需要 Docker 映射。

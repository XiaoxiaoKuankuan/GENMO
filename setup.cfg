[metadata]
name = gem
version = 0.1.0
description = BUMI text-conditioned robot motion generation
long_description = file: README.md
long_description_content_type = text/markdown
license = NVIDIA OneWay Noncommercial License
license_files = LICENSE

[options]
packages = find:
python_requires = >=3.10
install_requires =
    torch>=2.5.0
    torchvision>=0.20.0
    timm==0.6.7
    lightning==2.3.0
    hydra-core==1.3
    hydra-zen
    hydra-colorlog
    rich
    numpy==1.23.5
    setuptools>=68.0
    termcolor
    einops
    imageio==2.34.1
    av<14
    tqdm
    scipy
    mujoco
    glfw
    PyYAML
    colorlog
    pillow
    wandb
    sentencepiece
    transformers
    huggingface_hub

[options.extras_require]
export =
    onnx
    onnxruntime
web =
    Flask>=3.1,<4
    waitress>=3.0,<4
train =
    tensorboardX
dev =
    pytest
    ruff
    pre-commit
    black

[options.packages.find]
include =
    gem
    gem.*
    tools

[options.package_data]
gem.runtime.text_motion_web =
    templates/*.html
    static/*.css
    static/*.js
